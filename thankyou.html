<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <link rel="shortcut icon" href="logo.jfif" type="image/x-icon">
    <link rel="stylesheet" href="thankyou.css">
</head>
<style>
    /* General Reset */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f8e8a0;
    color: #333;
}

main {
    text-align: center;
    margin-top: 50px;
}

.confirmation {
    background-color: #fff5d6;
    padding: 50px;
    border-radius: 10px;
    display: inline-block;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.confirmation h1 {
    font-size: 2em;
    color: #444;
}

.confirmation p {
    margin: 20px 0;
    font-size: 1.2em;
}

button {
    background-color: #f54442;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
}

button:hover {
    background-color: #d43a37;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #e6b800;
    padding: 10px 20px;
  }
  
  .nav-left button,
  .nav-right button {
    background: none;
    border: none;
    color: black;
    font-size: 14px;
    margin-right: 10px;
    cursor: pointer;
  }
  
  .nav-left button:hover,
  .nav-right a:hover {
    text-decoration: underline;
  }
  
  .nav-right input {
    padding: 5px;
    font-size: 14px;
  }
  
  .nav-right .icon-button {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }
  
  .nav-right a {
    font-size: 14px;
    color: black;
    text-decoration: none;
  }
  
  /* Main Section */
  main {
    padding: 20px;
    text-align: center;
  }
  
  main h1 {
    background-color: #ffcc00;
    color: black;
    padding: 10px;
  }
  
  .contact-content {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    margin-top: 20px;
  }
  
  .contact-item {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    width: 30%;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
  }
  
  .contact-item .contact-icon {
    font-size: 50px;
    color: #333;
    margin-bottom: 10px;
  }
  
  .contact-item p {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
  }
  
  header {
    justify-content: space-between;
    align-items: center;
    background-color: #0018f9; /* Yellow background */
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
  }
  
  header nav {
    flex-grow: 1; /* Allows the nav bar to take up available space */
    display: flex;
    justify-content: center; /* Centers the links horizontally */
  }
  
  header nav a {
    text-decoration: none;
    margin: 0 15px; /* Adds spacing between links */
    color: rgb(255, 255, 255); /* Black text color */
    font-weight: bold; /* Bold text for navigation links */
  }
  
  header .header-icons {
    display: flex;
    align-items: center;
    gap: 15px; /* Spacing between icons and links */
  }
  
  header .header-icons a {
    text-decoration: none;
    color: red; /* Red text for login/sign-in */
    font-weight: bold; /* Bold text */
  }
  
  header .header-icons a:hover {
    text-decoration: underline; /* Adds underline on hover for login/sign-in */
  }
</style>
<body>
    <header>
        <nav>
            <a href="first.html">HOME PAGE</a>
            <a href="productPage.html">PRODUCTS</a>
            <a href="about.html">ABOUT US</a>
            <a href="contact.html">CONTACT US</a>
        </nav>
    </header>
    <main>
        <div class="confirmation">
            <h2>Order Placed Successfully!</h2>
            <p>Thank you for buying our product!</p>
            <p>You can get your ordered product from our office.</p>
            <button id="backToMenu">Back to Home</button>
        </div>
    </main>

    <script src="thankyou.js"></script>
</body>
</html>
